# Le Storybook, construit en site statique et publie sur GitHub Pages a
# chaque poussee sur main. Rien n'est commite : le build est refait ici,
# `storybook-static/` reste ignore par git.
name: Storybook

on:
  push:
    branches: [main]
  # de quoi republier sans avoir a pousser un commit
  workflow_dispatch:

# ce que Pages demande pour se laisser deployer par une action
permissions:
  contents: read
  pages: write
  id-token: write

# une publication a la fois : deux poussees rapprochees se marcheraient
# dessus, et c'est la derniere qui compte
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` et non `install` : on veut exactement le package-lock du depot
      - run: npm ci

      # le typecheck garde la porte : un Storybook qui ne compile pas n'a
      # rien a faire en ligne
      - run: npm run typecheck
      - run: npm run storybook:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
